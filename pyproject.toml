# Workspace root (virtuel) — n'est pas un package lui-même.
# Il orchestre les membres du mono-repo et partage un unique uv.lock + .venv.

[tool.uv.workspace]
members = ["packages/*"]

# Collecte pytest BORNÉE aux membres du workspace : sans `testpaths`, pytest
# scanne tout l'arbre, et un `test_*.py` de référence déposé n'importe où devient
# une erreur de collecte qui rend `make check` rouge sans qu'aucun test du projet
# ne soit en cause.
[tool.pytest.ini_options]
testpaths = ["packages"]

# Outillage de dev partagé par tout le workspace (PEP 735).
[dependency-groups]
# Floors = the versions actually used (see the FLOOR POLICY note in
# packages/support-agent/pyproject.toml).
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    # Le `TestClient` de FastAPI a besoin d'un client HTTP ; Starlette réclame
    # désormais `httpx2`.
    "httpx2>=2.9.1",
    "support-agent[server]",
]

# Le groupe dev réclame l'extra `server` du membre local : sans cette source, uv
# irait le chercher sur PyPI.
[tool.uv.sources]
support-agent = { workspace = true }
