[project]
name = "support-agent"
version = "0.1.0"
description = "Agent IA de support client, agnostique au LLM (LangChain + LangGraph + LangSmith)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Cœur LangChain / LangGraph
    "langchain>=0.3",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.0",
    "langsmith>=0.1",
    # Config typée depuis .env
    "numpy>=2.4.6",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # NOTE : les intégrations providers (langchain-mistralai, langchain-groq,
    # langchain-google-genai, langchain-openai, langchain-azure-ai...) seront
    # ajoutées au fil des phases, selon le provider choisi. Ex :
    #   uv add langchain-mistralai
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]
