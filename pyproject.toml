# Workspace root (virtuel) — n'est pas un package lui-même.
# Il orchestre les membres du mono-repo et partage un unique uv.lock + .venv.
# Détail : docs/architecture.md §9 et docs/workspace-et-deploiement.md.

[tool.uv.workspace]
members = ["packages/*"]

# La collecte pytest est BORNÉE aux membres du workspace, explicitement.
#
# Pourquoi ce n'est pas cosmétique : sans `testpaths`, pytest scanne tout l'arbre
# depuis la racine. Un fichier `test_*.py` déposé n'importe où — matériel de
# référence, exemple copié d'un autre dépôt, brouillon — est alors COLLECTÉ, et
# son `conftest.py` est importé avant tout le reste. Un import manquant y devient
# une erreur de collecte qui rend `make check` rouge sans qu'aucun test du projet
# ne soit en cause. C'est arrivé le 2026-07-29 avec les tests d'acceptance Velmo
# posés à la racine (voir docs/brief/tests-reference/README.md).
#
# Les tests du projet vivent dans `packages/*/tests/` — cette ligne dit exactement
# ça, et laisse le reste de l'arbre libre de contenir des `test_*.py` de référence.
[tool.pytest.ini_options]
testpaths = ["packages"]

# Outillage de dev partagé par tout le workspace (PEP 735).
[dependency-groups]
# Floors = the versions actually used (see the FLOOR POLICY note in
# packages/support-agent/pyproject.toml). `pytest>=8.0` was the worst offender:
# CI ran 9.1.1, so the floor allowed a MAJOR version nothing ever tested.
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    # Tests de l'exposition HTTP : le `TestClient` de FastAPI a besoin d'un client
    # HTTP. Starlette réclame désormais `httpx2` (avec `httpx`, il émet une
    # StarletteDeprecationWarning) — on prend donc le rail à jour directement.
    # Distinction volontaire : l'extra `server` de support-agent = ce que la PROD
    # installe ; ce groupe dev = ce que MA machine a en plus pour tester.
    "httpx2>=2.9.1",
    "support-agent[server]",
]

# Le groupe dev réclame l'extra `server` du membre local : sans cette source, uv
# irait le chercher sur PyPI.
[tool.uv.sources]
support-agent = { workspace = true }
