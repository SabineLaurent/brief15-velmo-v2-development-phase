[project]
name = "frontend"
version = "0.1.0"
description = "Chainlit demo shell (scope B, niveau 1) — voir l'agent parler"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # The agent brain, consumed through its ONE public seam (`stream_reply`).
    # `workspace = true` (below) points this at the sibling member, not PyPI.
    "support-agent",
    # The demo shell: a chat UI in the browser with zero front-end code.
    "chainlit>=2.0",
]

# uv workspace wiring: resolve `support-agent` from the local workspace member
# instead of downloading it — the whole point of the mono-repo.
[tool.uv.sources]
support-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontend"]
