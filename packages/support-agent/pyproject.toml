[project]
name = "support-agent"
version = "0.1.0"
description = "Agent IA de support client, agnostique au LLM (LangChain + LangGraph + LangSmith)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Cœur LangChain / LangGraph
    "langchain>=0.3",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langsmith>=0.1",
    # Config typée depuis .env
    "numpy>=2.4.6",
    # The `[binary]` extra is NOT optional in practice: plain `psycopg` is only a
    # wrapper and needs a libpq to talk to, which neither a dev machine nor a
    # `python:slim` image has by default ("no pq wrapper available" at import).
    # The extra ships a prebuilt libpq inside the wheel, so nothing system-level
    # has to be installed in the container.
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # NOTE : les intégrations providers (langchain-mistralai, langchain-groq,
    # langchain-google-genai, langchain-openai, langchain-azure-ai...) seront
    # ajoutées au fil des phases, selon le provider choisi. Ex :
    #   uv add langchain-mistralai
    "sqlalchemy>=2.0",
]

# The HTTP exposure (deployment step 1) is OPTIONAL on purpose: the CLI agent and
# the Chainlit shell import `stream_reply` in-process and have no use for a web
# server. Keeping it an extra means the container image installs it (`--extra
# server`) while `make run` stays lean. See docs/plan-deploiement-2026-07-25.md.
[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]
