[project]
# Distribution name with a hyphen, import name with an underscore. "chainlit" is
# in the name on purpose: this member is ONE client implementation, replaceable
# without touching the brain.
name = "client-chainlit"
version = "0.1.0"
description = "Chainlit demo shell (scope B, niveau 1) — voir l'agent parler"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # The demo shell: a chat UI in the browser with zero front-end code.
    "chainlit>=2.11.1",
    # The ONLY way this package reaches the agent. `support-agent` is
    # deliberately NOT a dependency: the client talks to a URL, not to a Python
    # object, which makes the decoupling a fact of the dependency graph.
    # ⚠️ The SHARED workspace `.venv` still contains `support_agent` (the root dev
    # group installs it for the tests), so a stray import would still run locally.
    # What catches it is the client's IMAGE, built from this closure alone.
    "httpx>=0.28.1",
    # SSE is a small protocol with sharp edges (keep-alive comments, multi-line
    # `data:`, `\n\n` framing): ~9 KB of dependency versus a parser we would get
    # subtly wrong.
    "httpx-sse>=0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client_chainlit"]
