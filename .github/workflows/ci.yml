# CI — la garde du dépôt : ce qui doit rester vrai à chaque push.
#
#   · `check`  — le code fait-il ce qu'on a écrit ?
#   · `images` — l'artefact qu'on déploiera démarre-t-il, en amd64 ?
#
# Ce que cette CI garde : la mécanique DÉTERMINISTE (factory LLM, garde-fous,
# couture, serveur HTTP, persistance). Ce qu'elle ne garde pas, volontairement :
# la QUALITÉ des réponses du modèle. Les cas de `test_eval.py` se skippent faute
# de credentials sur le runner, et c'est le bon comportement — des évaluations non
# déterministes n'ont pas leur place dans une gate binaire. `make score` obéit à
# la même doctrine : par défaut il ne note que les dimensions déterministes,
# calculées sans LLM ni réseau.

name: CI

on:
  # Sur toutes les branches : le retour arrive pendant qu'on écrit, pas au merge.
  push:
    branches: ["**"]

  # Sur les PR visant `dev` et `main` — pas un doublon : un push teste la branche
  # telle quelle, une PR teste le RÉSULTAT DE LA FUSION. Si la base a avancé, la
  # fusion peut casser alors que les deux branches sont vertes séparément.
  pull_request:
    branches: [dev, main]

# Un seul run utile par branche : un nouveau push annule celui en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Moindre privilège : ce workflow lit le dépôt et n'écrit rien.
permissions:
  contents: read

jobs:
  check:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Un Postgres jetable, le temps du job : la dimension MÉMOIRE doit être notée
    # sur le moteur de production, pas seulement sur SQLite. R3 est l'isolation
    # entre clients, et la requête de similarité qui pourrait ramener la ligne du
    # voisin appartient au store (sqlite-vec ⇄ pgvector), pas à nous.
    #
    # `pgvector/pgvector`, pas `postgres` : l'image officielle n'embarque pas
    # l'extension `vector`. Même image que `compose.yaml`. Le healthcheck n'est
    # pas décoratif — sans lui, les steps démarrent dès que le conteneur tourne,
    # pas quand Postgres accepte les connexions.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # Volontairement PAS `DATABASE_URL` : celle-là configure l'application, et un
    # `make score` qui créerait — et supprimerait — des schémas dans la base
    # configurée d'une développeuse serait un piège.
    env:
      EVAL_DATABASE_URL: postgres://agent:agent@localhost:5432/agent

    steps:
      # Chaque action est référencée comme sa propre doc le prescrit :
      #   · actions/checkout   → tag majeur mobile, maintenu.
      #   · astral-sh/setup-uv → SHA complet + version en commentaire. Un SHA est
      #     immuable, mais il n'y a plus de mise à jour automatique — d'où le
      #     commentaire de version, obligatoire.
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # La version cible du projet, pas « celle du runner ».
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--locked` échoue si uv.lock n'est plus cohérent avec les pyproject.toml.
      # En local `uv run` re-résout en silence, donc un `uv add` non commité
      # passerait inaperçu — et casserait le build de l'image, où
      # `uv sync --frozen` n'a pas ce luxe.
      - name: Installer les dépendances (verrouillées)
        run: uv sync --locked

      # Porte d'entrée unique : la CI lance exactement la commande qu'on lance en
      # local. Si les deux divergent, aucun des deux verts ne veut plus rien dire.
      - name: make check (ruff + pytest)
        run: make check

      # La porte de QUALITÉ après celle de MÉCANIQUE, dans cet ordre : un test
      # cassé doit se lire comme un test cassé, pas comme une note qui chute.
      #
      # `--require-postgres` est la seule porte qui ne regarde pas un chiffre :
      # une note ne peut pas s'apercevoir qu'elle a été calculée sur la moitié des
      # moteurs. Sans ce drapeau, un service `postgres` qui n'aurait pas démarré
      # donnerait un 12/12 vert couvrant deux fois moins qu'il n'en a l'air.
      - name: make score (note + seuil bloquant, Postgres exigé)
        run: make score ARGS=--require-postgres

  images:
    name: images (amd64) — découplage + démarrage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Pas de `needs: check` : les deux jobs répondent à deux questions
    # indépendantes, et aucune n'est un prérequis de l'autre.

    steps:
      - uses: actions/checkout@v7

      # Le script est en stdlib pure et `make docker-smoke` l'invoque en
      # `--no-project` : aucun `uv sync` ici. Ce job ne teste que ce qui est dans
      # les images, ce qui est précisément son intérêt.
      - name: Installer uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      # Ce job ne peut pas se faire en local : la machine de dev est arm64, la
      # cible exécute du linux/amd64, et une image arm64 échoue au DÉPLOIEMENT,
      # pas au build. Le runner étant amd64, `--platform` y est un no-op — mais il
      # rend l'exigence explicite le jour où le runner change.
      #
      # Aucun cache de build : l'utiliser imposerait une commande différente de
      # celle du Makefile, et le vert de la CI ne dirait plus rien de
      # `make docker-smoke` en local.
      #
      # Ce que le script assère :
      #   1. l'image du client ne contient ni `support_agent`, ni `langchain`,
      #      ni `langchain_core`, ni `langgraph` — la preuve du découplage ;
      #   2. l'image de l'agent démarre pour de vrai : elle refuse de servir sans
      #      clé (fail-closed), s'échauffe, et `/health` + `/ready` répondent.
      # Aucun secret : l'unique dépendance réseau du démarrage (les embeddings)
      # est servie par un stub local.
      - name: make docker-smoke (build amd64 + vérification des deux images)
        run: make docker-smoke PLATFORM=linux/amd64
