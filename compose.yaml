# Pile locale de l'agent : `client` → `agent-api` → `postgres`.
#
#   make docker-up      # construit si besoin, puis démarre en arrière-plan
#   make docker-logs    # suit les logs
#   make docker-down    # arrête (garde le volume)
#
# Les ports publiés sont volontairement différents de ceux du dev local
# (`make serve` :8000 · `make ui` :8001) :
#   dev local  → agent :8000  · UI :8001
#   conteneurs → agent :8100  · UI :8101

services:
  postgres:
    # L'image officielle `postgres` n'a pas pgvector ; celle-ci l'embarque.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    # Pas de `ports:` — la base n'est pas exposée à l'hôte. Pour l'inspecter
    # avec psql, décommenter :
    #   ports: ["5432:5432"]

  agent-api:
    build:
      context: .
      dockerfile: packages/support-agent/Dockerfile
    image: support-agent:dev

    env_file:
      - .env

    # `env_file` écrase les ENV de l'image ; ce bloc a la priorité la plus haute
    # et rétablit ce que le conteneur exige.
    environment:
      KNOWLEDGE_DIR: /app/data/kb-velmo
      PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
      DATABASE_SCHEMA: agent_state
      # Le conteneur exige toujours la clé de service, quoi que dise le .env.
      API_ALLOW_UNAUTHENTICATED: "false"
      WORKING_MEMORY_DB_PATH: /app/database/working_memory/checkpoints.db
      AGENT_MEMORY_DB_PATH: /app/database/agent_memory/memories.db
      SUPPORT_BACKEND: memory

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8100:8000"

    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    image: client-chainlit:dev

    # Pas d'`env_file` ici : le client n'a besoin d'aucun secret du cerveau.
    environment:
      AGENT_API_URL: http://agent-api:8000
      AGENT_API_KEY: ${API_KEY:-}

    depends_on:
      agent-api:
        condition: service_healthy

    ports:
      - "8101:8000"

    restart: unless-stopped

volumes:
  postgres-data:
  agent-state:
